<h1>Marcas de Almagre</h1>
<p class="sub">Identidades ficticias del mundo Clawd para decorar las películas: cada marca tiene carácter, lema, paleta y un emblema dibujado con código. Nada copia logos reales.</p>
<div class="grid" id="g"></div>
<script>
const TAU = Math.PI * 2, PI = Math.PI;
/* =====================================================================
   MARCAS DEL MUNDO CLAWD · identidades ficticias para decorar las películas (como las de un mundo de Rockstar):
   cada marca tiene nombre, rubro, personalidad, lema, paleta, tipografía y un emblema dibujado con código.
   Nada copia logos reales: son genéricas en la forma y con alma en el carácter.
   Uso: marcaLogo(g, id, x, y, h, o) dibuja emblema + nombre con la esquina superior izquierda en (x, y), alto h.
        o.mono = [r,g,b] (todo en un color: grabado, sello, neón), o.layout = 'h' | 'v' | 'emblema', o.sub = false
   ===================================================================== */
const MFONT = {
  serif: '"Playfair Display", "Cormorant Garamond", Georgia, serif', sans: '"Josefin Sans", "Futura", "Trebuchet MS", sans-serif',
  cond: '"Bebas Neue", "Oswald", Impact, "Arial Narrow", sans-serif', mono: '"Space Mono", ui-monospace, "Courier New", monospace', script: '"Pacifico", "Brush Script MT", cursive',
};
const MARCAS = {

    personalidad: 'Orgullo italiano y teatro: cromo, rojo y un silbido de vapor. Cree que la presión es una emoción.',
    lema: 'La presión es una emoción.', pal: [[179, 36, 31], [200, 204, 210], [26, 24, 26], [246, 242, 236]], donde: 'La cafetera cromada de la barra' },
  brujula: { nombre: 'Guía Brújula', sub: 'GASTRONÓMICA', rubro: 'Guía de restaurantes (otorga estrellas)', fuente: 'serif',
    personalidad: 'Severa, anónima y puntual. Sus inspectores comen solos y nunca repiten plato. Tinta azul, papel crema.',

    lema: 'Ladrillo, vapor y puerto.', pal: [[138, 59, 43], [232, 220, 198], [52, 70, 86], [200, 160, 70]], donde: 'Parquímetros, bocas de incendio, farolas, señales, bancos del parque' },
  nimbo: { nombre: 'Nimbo', sub: '', rubro: 'Portátiles', fuente: 'sans',

  tikket: { nombre: 'Tikket', sub: 'IMPRESORAS TÉRMICAS', rubro: 'Impresoras de comandas', fuente: 'mono',
    personalidad: 'Incansable y algo pasivo-agresiva: imprime comandas sin pausa y pita cuando nadie la mira.',

};
const mcss = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
/* ---------- emblemas en un cuadrado de lado 1 (origen arriba a la izquierda) ---------- */
const MEMB = {
  molienda(g, P) {   /* sello redondo: piedra de molino con estrías y una voluta de vapor */

    g.strokeStyle = mcss(P[1]); g.lineWidth = .025; g.beginPath(); g.arc(.5, .5, .44, 0, TAU); g.stroke();
    g.fillStyle = mcss(P[2]); g.beginPath(); g.arc(.5, .58, .22, 0, TAU); g.fill();
    g.strokeStyle = mcss(P[0]); g.lineWidth = .018; for (let k = 0; k < 8; k++) { const a = k / 8 * TAU; g.beginPath(); g.moveTo(.5 + Math.cos(a) * .06, .58 + Math.sin(a) * .06); g.lineTo(.5 + Math.cos(a + .35) * .2, .58 + Math.sin(a + .35) * .2); g.stroke(); }
    g.fillStyle = mcss(P[0]); g.beginPath(); g.arc(.5, .58, .045, 0, TAU); g.fill();
    g.strokeStyle = mcss(P[1]); g.lineWidth = .035; g.lineCap = 'round'; g.beginPath(); g.moveTo(.5, .33); g.bezierCurveTo(.42, .26, .58, .22, .5, .13); g.stroke();
  },
  vaporetta(g, P) {   /* V alada con un hilo de vapor */

    g.fillStyle = mcss(P[1]); for (const s of [-1, 1]) { g.beginPath(); for (let k = 0; k < 3; k++) { const y = .3 + k * .1; g.moveTo(.5 + s * (.3 + k * .02), y); g.quadraticCurveTo(.5 + s * (.48 - k * .04), y - .06, .5 + s * (.5 - k * .05), y + .02); g.lineTo(.5 + s * (.32 + k * .02), y + .05); } g.fill(); }
    g.strokeStyle = mcss(P[1]); g.lineWidth = .03; g.lineCap = 'round'; g.beginPath(); g.moveTo(.5, .2); g.bezierCurveTo(.44, .14, .56, .1, .5, .03); g.stroke();
  },
  brujula(g, P) {   /* rosa de los vientos con estrella al centro */

    for (let k = 0; k < 4; k++) { const a = k * PI / 2 - PI / 2; g.fillStyle = mcss(k % 2 ? P[0] : P[1]); g.beginPath(); g.moveTo(.5 + Math.cos(a) * .44, .5 + Math.sin(a) * .44); g.lineTo(.5 + Math.cos(a + .5) * .1, .5 + Math.sin(a + .5) * .1); g.lineTo(.5, .5); g.lineTo(.5 + Math.cos(a - .5) * .1, .5 + Math.sin(a - .5) * .1); g.closePath(); g.fill(); }
    g.fillStyle = mcss(P[2]); mStar(g, .5, .5, .09, .04, 5); g.fill(); g.strokeStyle = mcss(P[0]); g.lineWidth = .012; g.stroke();
  },
  brasa(g, P) {   /* brasa en rombo bajo tres líneas de bruma */
    g.fillStyle = mcss(P[1]); g.beginPath(); g.moveTo(.5, .14); g.bezierCurveTo(.72, .36, .7, .58, .5, .7); g.bezierCurveTo(.3, .58, .28, .36, .5, .14); g.fill();
    g.fillStyle = mcss(shiftC(P[1], .35)); g.beginPath(); g.moveTo(.5, .36); g.bezierCurveTo(.6, .48, .58, .58, .5, .63); g.bezierCurveTo(.42, .58, .4, .48, .5, .36); g.fill();
    g.strokeStyle = mcss(P[0]); g.lineCap = 'round'; for (let k = 0; k < 3; k++) { g.lineWidth = .04 - k * .008; g.beginPath(); const y = .76 + k * .08; g.moveTo(.16 + k * .06, y); g.bezierCurveTo(.36, y - .05, .5, y + .05, .84 - k * .06, y - .01); g.stroke(); }
  },
  kronotek(g, P) {   /* K en cuña con líneas de velocidad */
    g.fillStyle = mcss(P[0]); g.beginPath(); g.moveTo(.3, .15); g.lineTo(.46, .15); g.lineTo(.4, .45); g.lineTo(.72, .15); g.lineTo(.92, .15); g.lineTo(.56, .48); g.lineTo(.8, .85); g.lineTo(.6, .85); g.lineTo(.44, .58); g.lineTo(.38, .85); g.lineTo(.2, .85); g.closePath(); g.fill();

  sobremesa(g, P) {   /* libro abierto con un tenedor como marcapáginas */
    g.fillStyle = mcss(P[0]); g.beginPath(); g.moveTo(.5, .3); g.quadraticCurveTo(.3, .2, .08, .26); g.lineTo(.08, .8); g.quadraticCurveTo(.3, .74, .5, .84); g.quadraticCurveTo(.7, .74, .92, .8); g.lineTo(.92, .26); g.quadraticCurveTo(.7, .2, .5, .3); g.fill();
    g.strokeStyle = mcss(P[1]); g.lineWidth = .02; for (let k = 0; k < 3; k++) { g.beginPath(); g.moveTo(.16, .38 + k * .12); g.quadraticCurveTo(.3, .34 + k * .12, .44, .4 + k * .12); g.stroke(); g.beginPath(); g.moveTo(.56, .4 + k * .12); g.quadraticCurveTo(.7, .34 + k * .12, .84, .38 + k * .12); g.stroke(); }
    g.fillStyle = mcss(P[2]); g.fillRect(.47, .06, .06, .36); for (let k = 0; k < 4; k++) g.fillRect(.445 + k * .03, .02, .018, .1);
  },
  gabinete(g, P) {   /* cartela ovalada con una hoja */
    g.strokeStyle = mcss(P[0]); g.lineWidth = .03; g.beginPath(); g.ellipse(.5, .5, .36, .46, 0, 0, TAU); g.stroke(); g.lineWidth = .012; g.beginPath(); g.ellipse(.5, .5, .31, .41, 0, 0, TAU); g.stroke();
    g.fillStyle = mcss(P[2]); g.beginPath(); g.moveTo(.5, .2); g.bezierCurveTo(.72, .36, .66, .64, .5, .8); g.bezierCurveTo(.34, .64, .28, .36, .5, .2); g.fill();
    g.strokeStyle = mcss(P[1]); g.lineWidth = .015; g.beginPath(); g.moveTo(.5, .24); g.lineTo(.5, .78); for (let k = 0; k < 4; k++) { g.moveTo(.5, .34 + k * .1); g.lineTo(.6, .28 + k * .1); g.moveTo(.5, .36 + k * .1); g.lineTo(.4, .3 + k * .1); } g.stroke();

    g.fillStyle = mcss(P[0]); g.beginPath(); g.arc(.42, .38, .26, 0, TAU); g.fill(); g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.arc(.52, .32, .23, 0, TAU); g.fill(); g.globalCompositeOperation = 'source-over';
    g.fillStyle = mcss(P[1]); g.beginPath(); g.moveTo(.06, .74); g.lineTo(.86, .7); g.quadraticCurveTo(.94, .72, .9, .76); g.lineTo(.06, .8); g.closePath(); g.fill();
    g.fillStyle = mcss(P[0]); g.fillRect(.06, .74, .22, .07);
    g.fillStyle = mcss(P[2]); g.fillRect(.72, .14, .18, .18);
  },
  firme(g, P) {   /* huella de zueco con una barra de firmeza */
    g.fillStyle = mcss(P[0]); g.beginPath(); g.ellipse(.42, .32, .2, .22, -.25, 0, TAU); g.fill(); g.beginPath(); g.ellipse(.5, .74, .16, .17, -.2, 0, TAU); g.fill();
    g.fillStyle = mcss(P[1]); g.fillRect(.12, .5, .76, .07);
  },
  valdes(g, P) {   /* cazo de perfil y martillo cruzado */
    g.fillStyle = mcss(P[0]); g.beginPath(); g.moveTo(.18, .42); g.lineTo(.66, .42); g.lineTo(.62, .78); g.quadraticCurveTo(.42, .86, .22, .78); g.closePath(); g.fill(); g.fillRect(.64, .44, .32, .06);
    g.strokeStyle = mcss(P[1]); g.lineWidth = .04; g.lineCap = 'round'; g.beginPath(); g.moveTo(.2, .12); g.lineTo(.6, .36); g.stroke(); g.fillStyle = mcss(P[1]); g.save(); g.translate(.2, .12); g.rotate(-.55 + PI / 2); g.fillRect(-.09, -.04, .18, .08); g.restore();
    g.fillStyle = mcss(shiftC(P[0], .3)); for (let k = 0; k < 5; k++) { g.beginPath(); g.arc(.26 + k * .08, .58 + (k % 2) * .08, .018, 0, TAU); g.fill(); }
  },
  almagre(g, P) {   /* escudo con torre de ladrillo y olas de vapor */
    g.fillStyle = mcss(P[0]); g.beginPath(); g.moveTo(.12, .08); g.lineTo(.88, .08); g.lineTo(.88, .52); g.quadraticCurveTo(.86, .84, .5, .96); g.quadraticCurveTo(.14, .84, .12, .52); g.closePath(); g.fill();
    g.fillStyle = mcss(P[1]); g.fillRect(.38, .3, .24, .34); for (let k = 0; k < 3; k++) g.fillRect(.36 + k * .1, .22, .07, .09);
    g.fillStyle = mcss(P[0]); g.fillRect(.46, .48, .08, .16);
    g.strokeStyle = mcss(P[1]); g.lineWidth = .03; g.lineCap = 'round'; for (let k = 0; k < 2; k++) { g.beginPath(); for (let i = 0; i <= 8; i++) { const x = .22 + i * .07, y = .74 + k * .08 + Math.sin(i * 1.6) * .02; i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
  },
  nimbo(g, P) { g.fillStyle = mcss(P[1]); g.beginPath(); g.arc(.36, .58, .17, PI * .5, PI * 1.5); g.arc(.52, .42, .22, PI, PI * 2); g.arc(.7, .58, .15, PI * 1.5, PI * .5); g.closePath(); g.fill(); },
  medialuna(g, P) { g.strokeStyle = mcss(P[0]); g.lineWidth = .06; g.beginPath(); g.arc(.5, .5, .36, PI * .3, PI * 1.7); g.stroke(); g.strokeStyle = mcss(P[1]); g.lineWidth = .04; mStar(g, .62, .4, .1, .045, 5); g.stroke(); },
  tikket(g, P) { g.fillStyle = mcss(P[0]); g.fillRect(.15, .3, .7, .36); g.fillStyle = mcss(P[1]); g.beginPath(); g.moveTo(.3, .12); g.lineTo(.7, .12); g.lineTo(.7, .5); for (let k = 0; k < 6; k++) g.lineTo(.7 - (k + .5) * .4 / 6, .5 + (k % 2 ? 0 : .04)); g.lineTo(.3, .5); g.closePath(); g.fill(); g.fillStyle = mcss(P[2]); g.fillRect(.72, .56, .06, .05); },
};
function mStar(g, cx, cy, ro, ri, n) { g.beginPath(); for (let k = 0; k < n * 2; k++) { const a = -PI / 2 + k * PI / n, r = k % 2 ? ri : ro; k ? g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r) : g.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } g.closePath(); }
function shiftC(c, k) { return k < 0 ? c.map(v => v * (1 + k)) : c.map(v => v + (255 - v) * k); }
/* ---------- logo completo ---------- */
function marcaLogo(g, id, x, y, h, o = {}) {
  const M = MARCAS[id]; if (!M) return 0;
  const P = o.mono ? [o.mono, o.mono, o.monoBg || [244, 238, 224], o.mono] : M.pal, lum = c => c[0] * .3 + c[1] * .59 + c[2] * .11, byL = M.pal.slice().sort((a, b) => lum(a) - lum(b)), ink = o.mono || (o.dark ? byL[byL.length - 1] : byL[0]), layout = o.layout || 'h';
  g.save(); g.globalAlpha *= o.a ?? 1;
  g.save(); g.translate(x, y); g.scale(h, h); MEMB[id](g, P); g.restore();
  if (layout === 'emblema') { g.restore(); return h; }
  const f = MFONT[M.fuente] || MFONT.serif, wx = layout === 'h' ? x + h * 1.15 : x + h / 2, wy = layout === 'h' ? y + h * (M.sub && o.sub !== false ? .52 : .66) : y + h * 1.32;
  g.fillStyle = mcss(ink); g.textAlign = layout === 'h' ? 'left' : 'center'; g.textBaseline = 'alphabetic';
