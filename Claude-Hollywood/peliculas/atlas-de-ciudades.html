<title>Atlas de ciudades</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Josefin+Sans:wght@600;700&display=swap">
<style>
:root { color-scheme: dark; --bg: #17130f; --fg: #f2e9d6; --dim: #b4a58c; --acc: #b2392e; --chip: rgba(30,24,20,.72); }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
body { font-family: "Cormorant Garamond", Georgia, serif; display: grid; place-items: center; background: var(--bg); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
.stage { position: relative; width: min(100%, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; max-width: 100%; }
#cv { display: block; width: 100%; height: 100%; }
body.cmp #cv { cursor: ew-resize; }
.ui { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px 12px; background: linear-gradient(transparent, rgba(16,12,10,.78)); display: flex; flex-direction: column; gap: 8px; opacity: 0; transition: opacity .4s; }
body.ui .ui, .ui:hover, .ui:focus-within { opacity: 1; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
button { font: 600 15px "Cormorant Garamond", Georgia, serif; color: var(--fg); background: var(--chip); border: 1px solid rgba(242,233,214,.25); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
button.on { background: var(--fg); color: #241c16; border-color: var(--fg); }
button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
#play { width: 40px; padding: 5px 0; }
.sep { width: 1px; height: 20px; background: rgba(242,233,214,.25); margin: 0 4px; }
#tl { height: 6px; background: rgba(242,233,214,.18); border-radius: 3px; cursor: pointer; }
#bar { height: 100%; width: 0; background: var(--fg); border-radius: 3px; }
@media (max-width: 640px) { button { font-size: 13px; padding: 4px 9px; } }
</style>
<div class="stage"><canvas id="cv" aria-label="Atlas de ciudades: fondos en acuarela y papel recortado"></canvas>
  <div class="ui">
    <div id="tl" role="slider" aria-label="Línea de tiempo"><div id="bar"></div></div>
    <div class="row"><button id="play" aria-label="Reproducir o pausar">▶</button><span class="sep"></span>
      <button data-mode="gira">Gira</button><button data-mode="wc">Acuarela</button><button data-mode="pp">Papel recortado</button><button data-mode="comparar">Comparar</button><span class="sep"></span>
      <span id="cities" class="row"></span></div>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   FONDOS · base: utilidades, ruido, papel y lienzo
   Unidades: alto de pantalla = 1000u, origen en el centro, y hacia abajo.
   ===================================================================== */
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sm = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const eio = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const rg = (t, a, b) => clamp((t - a) / (b - a));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = mulberry32(1);
const seed = s => { R = mulberry32(s); };
const rnd = (a = 1, b) => b === undefined ? R() * a : a + R() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(R() * arr.length)];

const NZ = (() => {
  const p = new Uint8Array(512), r = mulberry32(1337), perm = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; [perm[i], perm[j]] = [perm[j], perm[i]]; }
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const g = (h, x, y) => { switch (h & 7) { case 0: return x + y; case 1: return -x + y; case 2: return x - y; case 3: return -x - y; case 4: return x; case 5: return -x; case 6: return y; default: return -y; } };
  const f = t => t * t * t * (t * (t * 6 - 15) + 10);
  function n2(x, y) {
    let X = Math.floor(x), Y = Math.floor(y); x -= X; y -= Y; X &= 255; Y &= 255;
    const u = f(x), v = f(y), a = p[X] + Y, b = p[X + 1] + Y;
    return lerp(lerp(g(p[a], x, y), g(p[b], x - 1, y), u), lerp(g(p[a + 1], x, y - 1), g(p[b + 1], x - 1, y - 1), u), v) * 0.75;
  }
  function fbm(x, y, o = 4) { let s = 0, a = .5, fr = 1; for (let i = 0; i < o; i++) { s += a * n2(x * fr, y * fr); fr *= 2.03; a *= .5; } return s; }
  return { n2, fbm };
})();
const N2 = NZ.n2, FBM = NZ.fbm;
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }

/* colores: [r,g,b] */
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const shadeC = (c, k) => k < 0 ? mixc(c, [0, 0, 0], -k) : mixc(c, [255, 255, 255], k);
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const PAPERC = [241, 233, 214];

/* ---------- geometría 2D ---------- */
const add = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const nrm2 = v => { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; };
function area(pts) { let s = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; }
const orient = pts => area(pts) < 0 ? pts.slice().reverse() : pts;
function densify(P, mx, closed = true) {
  const o = [], n = P.length;
  for (let i = 0; i < (closed ? n : n - 1); i++) { const a = P[i], b = P[(i + 1) % n], d = Math.hypot(b[0] - a[0], b[1] - a[1]), k = Math.max(1, Math.ceil(d / mx)); for (let j = 0; j < k; j++) o.push([lerp(a[0], b[0], j / k), lerp(a[1], b[1], j / k)]); }
  if (!closed) o.push(P[n - 1]);
  return o;
}
const rect = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];   // (x,y) = esquina superior izquierda
function ell(cx, cy, rx, ry, n = 28, a0 = 0, a1 = TAU) { const o = []; for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i / n); o.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return o; }
function bbox(pts) { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const p of pts) { if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0]; if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; } return [x0, y0, x1, y1]; }
/* tira con grosor a lo largo de una polilínea (cables, barandillas) */
function strip(pts, w) {
  const L = [], Rr = [];
  for (let i = 0; i < pts.length; i++) { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)], d = nrm2(sub(b, a)), n = [-d[1] * w / 2, d[0] * w / 2]; L.push(add(pts[i], n)); Rr.push(sub(pts[i], n)); }
  return L.concat(Rr.reverse());
}
/* catenaria aproximada entre dos puntos */
function sag(a, b, s, n = 24) { const o = []; for (let i = 0; i <= n; i++) { const t = i / n; o.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t) + s * 4 * t * (1 - t)]); } return o; }
function pathPolys(polys) { const P = new Path2D(); for (const q of polys) { if (q.length < 2) continue; P.moveTo(q[0][0], q[0][1]); for (let i = 1; i < q.length; i++) P.lineTo(q[i][0], q[i][1]); P.closePath(); } return P; }
function pathLine(pts) { const P = new Path2D(); P.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) P.lineTo(pts[i][0], pts[i][1]); return P; }
/* contorno «a mano»: desplaza los puntos con ruido suave (amt en unidades) */
function wobble(pts, amt, s0 = 0, f = .02, closed = true) {
  const D = densify(pts, 14, closed);
  return D.map((p, i) => [p[0] + N2(p[0] * f + s0, p[1] * f) * amt, p[1] + N2(p[1] * f + 7 + s0, p[0] * f) * amt]);
}

/* ---------- papel y texturas (una vez por tamaño de pantalla) ---------- */
let W = 0, H = 0, U = 1, SW = 1, PAPER = null, GRAIN = null, BLOT = null, FIBER = null;
function makePaper(w, h) {
  const c = mk(w, h), x = c.getContext('2d');
  const g = x.createRadialGradient(w * .5, h * .42, 0, w * .5, h * .5, Math.hypot(w, h) * .62);
  g.addColorStop(0, '#f3ebd8'); g.addColorStop(.6, '#ebe0c7'); g.addColorStop(1, '#d9c7a4');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  const lw = Math.ceil(w / 10), lh = Math.ceil(h / 10), lc = mk(lw, lh), lg = lc.getContext('2d'), im = lg.createImageData(lw, lh);
  for (let j = 0; j < lh; j++) for (let i = 0; i < lw; i++) { const v = FBM(i * .035 + 3, j * .035 + 9, 5), k = (j * lw + i) * 4; im.data[k] = 150; im.data[k + 1] = 118; im.data[k + 2] = 70; im.data[k + 3] = clamp(v * 1.6 + .3) * 46; }
  lg.putImageData(im, 0, 0); x.globalCompositeOperation = 'multiply'; x.drawImage(lc, 0, 0, w, h); x.globalCompositeOperation = 'source-over';
  return c;
}
/* grano de papel prensado en frío: el pigmento se asienta en los valles (granulado) */
function makeGrain() {
  const s = 256, c = mk(s, s), x = c.getContext('2d'), id = x.createImageData(s, s), d = id.data, r = mulberry32(9);
  for (let j = 0; j < s; j++) for (let i = 0; i < s; i++) {
    const k = (j * s + i) * 4, n = N2(i * .3, j * .3) * .5 + .5, q = r(), v = clamp(n * n * 1.2 + (q > .7 ? (q - .7) * 1.6 : 0));
    d[k] = d[k + 1] = d[k + 2] = 255 - v * 120; d[k + 3] = 255;
  }
  x.putImageData(id, 0, 0); return c;
}
/* manchas de lavado (densidad irregular del pigmento), sin costuras por espejo */
function makeBlot() {
  const s = 384, c = mk(s, s), x = c.getContext('2d'), id = x.createImageData(s, s), d = id.data;
  for (let j = 0; j < s; j++) for (let i = 0; i < s; i++) { const k = (j * s + i) * 4, v = clamp(.5 + FBM(i * .011, j * .011, 4) * 1.1 + N2(i * .09, j * .09) * .12); d[k] = d[k + 1] = d[k + 2] = 255 - v * 70; d[k + 3] = 255; }
  x.putImageData(id, 0, 0);
  const m = mk(s * 2, s * 2), g = m.getContext('2d');
  for (const [sx, sy] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) { g.save(); g.translate(sx < 0 ? s * 2 : 0, sy < 0 ? s * 2 : 0); g.scale(sx, sy); g.drawImage(c, 0, 0); g.restore(); }
  return m;
}
/* fibras de papel de color (para el papel recortado) */
function makeFiber() {
  const s = 256, c = mk(s, s), x = c.getContext('2d'), r = mulberry32(31);
  x.fillStyle = '#808080'; x.fillRect(0, 0, s, s);
  const id = x.getImageData(0, 0, s, s), d = id.data;
  for (let j = 0; j < s; j++) for (let i = 0; i < s; i++) { const k = (j * s + i) * 4, v = 128 + N2(i * .5, j * .5) * 22 + (r() - .5) * 14; d[k] = d[k + 1] = d[k + 2] = v; }
  x.putImageData(id, 0, 0);
  x.lineCap = 'round';
  for (let i = 0; i < 260; i++) { const px = r() * s, py = r() * s, a = r() * TAU, l = 4 + r() * 16, b = r() < .5; x.strokeStyle = b ? 'rgba(255,255,255,.22)' : 'rgba(0,0,0,.14)'; x.lineWidth = .6 + r() * .7; x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + Math.cos(a + 1) * l * .5, py + Math.sin(a + 1) * l * .5, px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke(); }
  return c;
}
function resizeTo(w, h) {
  W = w; H = h; U = H / 1000; SW = W / U;
  PAPER = makePaper(W, H);
  if (!GRAIN) { GRAIN = makeGrain(); BLOT = makeBlot(); FIBER = makeFiber(); }
}

/* =====================================================================
   GEOMETRÍA CON SIGNIFICADO
   Una capa guarda piezas que saben lo que son; cada estilo decide cómo pintarlas:
     solid  · masa principal (muro, monte)        shade · plano en sombra (lateral)
     trim   · pieza de otro color (tejado, toldo)  line  · elemento lineal (cable, poste, barandilla)
     win    · ventana (hueco)                      lat   · celosía (torre de hierro)
     tree   · árbol (redondo, ciprés, pino, palmera)  glow · farol / luz puntual
   ===================================================================== */
class Lay {
  constructor(p, o = {}) { this.p = p; this.items = []; this.haze = o.haze ?? Math.max(0, .75 - p) * .9; this.name = o.name || ''; this.ink = o.ink ?? (p > .25); this.sway = o.sway || 0; this.shadow = o.shadow ?? 1; }
  solid(pts, c, o = {}) { this.items.push({ t: 'solid', pts, c, ink: o.ink ?? 1, wet: o.wet ?? 1, grad: o.grad ?? .12, land: !!o.land }); return this; }
  shade(pts, c) { this.items.push({ t: 'shade', pts, c }); return this; }
  trim(pts, c, o = {}) { this.items.push({ t: 'trim', pts, c, ink: o.ink ?? 0 }); return this; }
  line(pts, w, c, o = {}) { this.items.push({ t: 'line', pts, w, c, closed: !!o.closed, ink: o.ink ?? 1 }); return this; }
  win(x, y, w, h, o = {}) { this.items.push({ t: 'win', x, y, w, h, lit: R() < (o.lit ?? .55), g: R(), arch: !!o.arch, c: o.c, warm: o.warm }); return this; }
  lat(pts, nx, ny, c) { this.items.push({ t: 'lat', pts, nx, ny, c }); return this; }
  tree(x, y, h, kind, c) { this.items.push({ t: 'tree', x, y, h, kind, c, s: R() * 1000 }); return this; }
  glow(x, y, r, c) { this.items.push({ t: 'glow', x, y, r, c }); return this; }
}

/* ---------- edificios genéricos ----------
   x = borde izquierdo, gy = suelo, w = ancho, h = alto (hacia arriba). Devuelve la cota del tejado. */
const ROOFS = {};
function facade(L, x, gy, w, h, o = {}) {
  const c = o.c, top = gy - h, side = o.side ?? Math.min(18, w * .16), sideDir = o.sideDir ?? 1;
  /* lateral en sombra: da volumen (vista ligeramente oblicua) */
  if (side > 1) { const sx = sideDir > 0 ? x + w : x - side, k = sideDir > 0 ? 1 : -1; L.shade([[x + (sideDir > 0 ? w : 0), top], [x + (sideDir > 0 ? w : 0) + k * side, top + side * .35], [x + (sideDir > 0 ? w : 0) + k * side, gy], [x + (sideDir > 0 ? w : 0), gy]], shadeC(c, -.25)); }
  L.solid(rect(x, top, w, h), c, { ink: o.ink ?? 1 });
  /* tejado */
  const roof = o.roof || 'flat', rc = o.roofC || shadeC(c, -.18);
  let rt = top;
  if (roof === 'flat') { L.trim(rect(x - 2, top - 5, w + 4, 6), shadeC(c, -.12)); rt = top - 5; }
  else if (roof === 'gable') { const rh = o.rh ?? w * .32; L.trim([[x - 4, top + 2], [x + w / 2, top - rh], [x + w + 4, top + 2]], rc); rt = top - rh; }
  else if (roof === 'hip') { const rh = o.rh ?? w * .22; L.trim([[x - 5, top + 2], [x + w * .28, top - rh], [x + w * .72, top - rh], [x + w + 5, top + 2]], rc); rt = top - rh; }
  else if (roof === 'mansard') {   /* París: mansarda de zinc con buhardillas */
    const rh = o.rh ?? Math.min(46, h * .22);
    L.trim([[x - 3, top + 2], [x + 8, top - rh], [x + w - 8, top - rh], [x + w + 3, top + 2]], rc);
    const nd = Math.max(1, Math.floor((w - 20) / 34));
    for (let i = 0; i < nd; i++) { const dx = x + 14 + (i + .5) * (w - 28) / nd - 7; L.trim([[dx - 2, top - rh * .2], [dx - 2, top - rh * .72], [dx + 7, top - rh * .95], [dx + 16, top - rh * .72], [dx + 16, top - rh * .2]], shadeC(c, .05)); L.win(dx + 2, top - rh * .68, 10, rh * .42, { lit: o.lit }); }
    rt = top - rh;
  } else if (roof === 'tile') {   /* teja roja mediterránea */
    const rh = o.rh ?? 12; L.trim([[x - 6, top + 3], [x + w * .5, top - rh], [x + w + 6, top + 3]], rc); rt = top - rh;
    L.line([[x - 6, top + 3], [x + w + 6, top + 3]], 1.4, shadeC(rc, -.3));
  } else if (roof === 'setback') {   /* rascacielos escalonado (art déco) */
    let yy = top, ww = w, xx = x; const steps = o.steps ?? 3;
    for (let i = 0; i < steps; i++) { const sh = h * (.06 + .03 * i), nx = xx + ww * .12, nw = ww * .76; L.solid(rect(nx, yy - sh, nw, sh), c, { ink: 1 }); winGrid(L, nx, yy - sh, nw, sh, { ...o, rows: 2, cols: Math.max(2, Math.round(nw / 14)) }); yy -= sh; xx = nx; ww = nw; }
    rt = yy;
    if (o.spire) { L.line([[xx + ww / 2, yy], [xx + ww / 2, yy - o.spire]], 3, shadeC(c, -.3)); rt = yy - o.spire; }
  }
  /* sombra que proyecta el alero sobre la fachada */
  if (h > 40 && roof !== 'setback') L.shade(rect(x, top, w, Math.min(10, h * .08)), shadeC(c, -.2));
  /* cornisas y molduras: líneas de luz y sombra que dan escala */
  if (o.cornice !== false && h > 60) {
    const fl = o.floorH ?? 24, nf = Math.floor((h - (o.shop ? 28 : 0)) / fl);
    L.trim(rect(x - 3, top, w + 6, 4), shadeC(c, .18));
    if (o.belt) for (const f of o.belt) L.trim(rect(x - 1, gy - (o.shop ? 28 : 0) - f * fl, w + 2, 3), shadeC(c, .14));
  }
  /* ventanas */
  if (o.rows !== 0) winGrid(L, x, top, w, h, o);
  /* planta baja: tiendas con toldo */
  if (o.shop) {
    const n = Math.max(1, Math.round(w / 40));
    for (let i = 0; i < n; i++) { const sx = x + 4 + i * (w - 8) / n, sw = (w - 8) / n - 6; L.win(sx, gy - 24, sw, 20, { lit: (o.lit ?? .5) + .3, warm: 1 }); if (o.awning) L.trim([[sx - 2, gy - 27], [sx + sw + 2, gy - 27], [sx + sw + 6, gy - 19], [sx - 6, gy - 19]], o.awning[i % o.awning.length]); }
  }
  /* chimeneas y antenas */
  if (o.chim) for (let i = 0; i < o.chim; i++) { const cx = x + rnd(.1, .85) * w, ch = rnd(10, 22); L.trim(rect(cx, rt - ch + 4, rnd(6, 10), ch), shadeC(c, -.22)); }
  if (o.tank) { const tx = x + rnd(.2, .7) * w; waterTank(L, tx, rt, shadeC(c, -.35)); }
  if (o.antenna) L.line([[x + w * .6, rt], [x + w * .6, rt - o.antenna]], 1.4, shadeC(c, -.4));
  return rt;
}
function winGrid(L, x, top, w, h, o) {
  const fl = o.floorH ?? 24, wh = o.winH ?? fl * .55, ww = o.winW ?? 9, gap = o.winGap ?? 18;
  const usable = h - (o.shop ? 30 : 6) - 8, rows = o.rows ?? Math.max(1, Math.floor(usable / fl)), cols = o.cols ?? Math.max(1, Math.floor((w - 10) / gap));
  const mx = (w - cols * gap) / 2 + (gap - ww) / 2;
  for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
    const wx = x + mx + k * gap, wy = top + 9 + r * fl + (fl - wh) * .3;
    if (wy + wh > top + h - (o.shop ? 28 : 4)) continue;
    L.win(wx, wy, ww, wh, { lit: o.lit, arch: o.arch && r === 0 });
    if (o.balc && (r === 1 || (o.balc === 'all' && r > 0))) L.line([[wx - 3, wy + wh + 2], [wx + ww + 3, wy + wh + 2]], 1.6, shadeC(o.c, -.45));
    if (o.shutter) { L.trim(rect(wx - 4, wy, 3.5, wh), o.shutter); L.trim(rect(wx + ww + .5, wy, 3.5, wh), o.shutter); }
  }

    if (dark) { g.shadowColor = 'rgba(10,8,20,.7)'; g.shadowBlur = 10 * U; }
    g.font = `italic 600 ${64 * U}px "Cormorant Garamond", Georgia, serif`; g.fillStyle = dark ? 'rgba(246,238,222,.95)' : 'rgba(40,28,26,.88)'; g.fillText(city.name, x, y);
    g.font = `500 ${20 * U}px "Cormorant Garamond", Georgia, serif`; g.fillStyle = dark ? 'rgba(232,222,204,.9)' : 'rgba(70,52,44,.85)'; g.fillText(`${city.country.toUpperCase()}   ·   ${city.coord}`, x + 4 * U, y + 34 * U);
    g.strokeStyle = 'rgba(150,40,40,.7)'; g.lineWidth = 2 * U; g.beginPath(); g.moveTo(x, y + 48 * U); g.lineTo(x + 220 * U * a, y + 48 * U); g.stroke();
  } else {
    g.font = `700 ${58 * U}px "Josefin Sans", "Futura", "Century Gothic", sans-serif`;
    g.shadowColor = 'rgba(20,14,10,.45)'; g.shadowBlur = 5 * U; g.shadowOffsetX = 3 * U; g.shadowOffsetY = 4 * U; g.fillStyle = 'rgb(250,244,230)'; g.fillText(city.name.toUpperCase(), x, y);
    g.shadowBlur = 3 * U; g.shadowOffsetX = 2 * U; g.shadowOffsetY = 2 * U; g.font = `600 ${18 * U}px "Josefin Sans", sans-serif`; g.fillStyle = css(city.accent || [190, 60, 50]);
    const label = `${city.country.toUpperCase()}  ·  ${city.coord}`, tw = g.measureText(label).width; g.fillRect(x, y + 18 * U, tw + 24 * U, 30 * U); g.shadowColor = 'transparent'; g.fillStyle = 'rgb(250,244,230)'; g.fillText(label, x + 12 * U, y + 39 * U);
  }
  g.restore();
}

/* ---------- gira: qué se ve en cada instante ---------- */
const UIS = { mode: 'gira', city: 0, split: .5, playing: false, t: 0, manualT: 0 };
const TOTAL = () => INTRO + CITIES.length * D + 6;
function tourAt(T) {   // → {i, lt, style, mix (0..1 papel), fade (negro), title}
  if (T < INTRO) return { intro: 1 - T / INTRO, i: 0, lt: 0 };
  const k = T - INTRO, i = Math.min(CITIES.length - 1, Math.floor(k / D)), lt = (k - i * D) / D;
  return { i, lt, mix: sm(rg(lt, .47, .56)), fade: Math.max(1 - rg(lt, 0, .05), rg(lt, .95, 1)) * (k > CITIES.length * D ? 1 : 1), title: Math.min(sm(rg(lt, .03, .08)), 1 - sm(rg(lt, .2, .26))) + Math.min(sm(rg(lt, .57, .6)), 1 - sm(rg(lt, .7, .76))), end: k >= CITIES.length * D };
}
/* desgarro: el papel recortado entra rasgando el papel de acuarela */
function tearPath(x, h, s) { const P = new Path2D(); P.moveTo(x, -10); for (let y = 0; y <= h + 10; y += 6) P.lineTo(x + N2(y * .02, s) * 26 * U + N2(y * .2, s + 3) * 5 * U, y); P.lineTo(W + 10, h + 10); P.lineTo(W + 10, -10); P.closePath(); return P; }
function composite(B, lt, t, mode, split) {
  if (mode === 'wc' || mode === 'pp') { drawCity(ctx, B, mode, lt, t); return; }
  /* gira (fundido rasgado) o comparar (divisor) */
  const x = split * W;
  if (x <= 1) { drawCity(ctx, B, 'pp', lt, t); return; } if (x >= W - 1) { drawCity(ctx, B, 'wc', lt, t); return; }
  drawCity(BUFA.getContext('2d'), B, 'wc', lt, t); drawCity(BUFB.getContext('2d'), B, 'pp', lt, t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(BUFA, 0, 0);
  const P = mode === 'comparar' ? (() => { const p = new Path2D(); p.rect(x, 0, W - x, H); return p; })() : tearPath(x, H, 9);
  ctx.save(); ctx.clip(P); ctx.drawImage(BUFB, 0, 0); ctx.restore();
  ctx.save(); if (mode === 'comparar') { ctx.fillStyle = 'rgba(250,244,230,.95)'; ctx.fillRect(x - 1.5, 0, 3, H); ctx.beginPath(); ctx.arc(x, H / 2, 16, 0, TAU); ctx.fill(); ctx.fillStyle = 'rgba(40,30,30,.8)'; ctx.font = `600 ${14}px sans-serif`; ctx.textAlign = 'center'; ctx.fillText('⇆', x, H / 2 + 5); }
  else { ctx.shadowColor = 'rgba(20,14,10,.5)'; ctx.shadowBlur = 10 * U; ctx.shadowOffsetX = -4 * U; ctx.strokeStyle = 'rgba(250,246,236,1)'; ctx.lineWidth = 5 * U; ctx.stroke(tearPath(x, H, 9)); }
  ctx.restore();
}
function introCard(a) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(PAPER, 0, 0, W, H);
  ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(40,28,26,.9)'; ctx.font = `italic 600 ${72 * U}px "Cormorant Garamond", Georgia, serif`; ctx.fillText('Atlas de ciudades', W / 2, H * .46);
  ctx.font = `500 ${24 * U}px "Cormorant Garamond", Georgia, serif`; ctx.fillStyle = 'rgba(80,60,50,.9)'; ctx.fillText('acuarela  ·  papel recortado', W / 2, H * .46 + 46 * U); ctx.textAlign = 'left'; ctx.globalAlpha = 1;
}

/* ---------- bucle ---------- */
let LAST = performance.now(), STATUS = '';
function frame(now) {
  const dt = Math.min(.1, (now - LAST) / 1000); LAST = now;
  if (sizeAll()) STATUS = '';
  if (UIS.playing) { if (UIS.mode === 'gira') UIS.t = Math.min(TOTAL(), UIS.t + dt); else UIS.manualT = (UIS.manualT + dt) % D; }
  render();
  requestAnimationFrame(frame);
}
function want(i) {
  if (CACHE.has(i)) return CACHE.get(i);
  if (!BUILDING) { BUILDING = buildCity(i, p => { STATUS = `Pintando ${CITIES[i].name}… ${Math.round(p * 100)}%`; }).then(() => { BUILDING = null; STATUS = ''; }); }
  return null;
}
function render() {
  let i, lt, mode, split = UIS.split, info = null;
  if (UIS.mode === 'gira') { info = tourAt(UIS.t); i = info.i; lt = info.lt; mode = 'gira'; split = 1 - info.mix; }
  else { i = UIS.city; lt = UIS.manualT / D; mode = UIS.mode; }
  CURI = i; updUI(i);
  if (info && info.intro !== undefined && info.intro > 0) { introCard(Math.min(1, info.intro * 2)); want(0); return; }
  const B = want(i);
  if (!B) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(PAPER, 0, 0, W, H); ctx.fillStyle = 'rgba(60,44,40,.85)'; ctx.font = `italic ${28 * U}px "Cormorant Garamond", Georgia, serif`; ctx.textAlign = 'center'; ctx.fillText(STATUS || 'Mezclando pigmentos…', W / 2, H / 2); ctx.textAlign = 'left'; return; }
  if (UIS.playing && !BUILDING && UIS.mode === 'gira' && lt > .3 && i + 1 < CITIES.length) want(i + 1);   // se prepara la siguiente
  composite(B, lt, UIS.mode === 'gira' ? UIS.t : UIS.manualT + i * 100, mode, split);
  if (info) {
    titleCard(ctx, B.city, lt < .5 ? 'wc' : 'pp', info.title, B.city.night(lt) > .45);
    if (info.fade > .001) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = info.fade; ctx.drawImage(PAPER, 0, 0, W, H); ctx.globalAlpha = 1; }
    if (info.end) introCard(rg(UIS.t - INTRO - CITIES.length * D, 0, 2));
  } else titleCard(ctx, B.city, mode === 'pp' ? 'pp' : 'wc', 1, B.city.night(lt) > .45);
}

/* ---------- interfaz ---------- */
const $ = s => document.querySelector(s);
function buildUI() {
  const chips = $('#cities');
  CITIES.forEach((c, i) => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = c.name; b.onclick = () => { if (UIS.mode === 'gira') { UIS.t = INTRO + i * D + .2; } else UIS.city = i; UIS.playing = true; }; chips.appendChild(b); });
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { const m = b.dataset.mode; if (m !== 'gira' && UIS.mode === 'gira') { const inf = tourAt(UIS.t); UIS.city = inf.i; UIS.manualT = inf.lt * D; } if (m === 'gira' && UIS.mode !== 'gira') UIS.t = INTRO + UIS.city * D + UIS.manualT; UIS.mode = m; UIS.playing = true; });
  $('#play').onclick = () => { UIS.playing = !UIS.playing; if (UIS.mode === 'gira' && UIS.t >= TOTAL()) UIS.t = 0; };
  let drag = false;
  cv.addEventListener('pointerdown', e => { if (UIS.mode === 'comparar') { drag = true; cv.setPointerCapture(e.pointerId); move(e); } });
  const move = e => { if (!drag) return; const r = cv.getBoundingClientRect(); UIS.split = clamp((e.clientX - r.left) / r.width, .02, .98); };
  cv.addEventListener('pointermove', move); cv.addEventListener('pointerup', () => drag = false);
  $('#tl').addEventListener('pointerdown', e => { const r = e.currentTarget.getBoundingClientRect(), f = clamp((e.clientX - r.left) / r.width); if (UIS.mode === 'gira') UIS.t = f * TOTAL(); else UIS.manualT = f * D; });
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); $('#play').click(); } if (e.key === 'ArrowRight') { if (UIS.mode === 'gira') UIS.t = Math.min(TOTAL(), UIS.t + 5); else UIS.manualT = (UIS.manualT + 2) % D; } if (e.key === 'ArrowLeft') { if (UIS.mode === 'gira') UIS.t = Math.max(0, UIS.t - 5); else UIS.manualT = (UIS.manualT - 2 + D) % D; } });
  let hideT = 0; const poke = () => { document.body.classList.add('ui'); clearTimeout(hideT); hideT = setTimeout(() => document.body.classList.remove('ui'), 2600); };
  addEventListener('pointermove', poke); poke();
}
let lastUI = '';
function updUI(i) {
  const key = UIS.mode + i + UIS.playing;
  if (key !== lastUI) { lastUI = key; document.querySelectorAll('.chip').forEach((b, k) => b.classList.toggle('on', k === i)); document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === UIS.mode)); $('#play').textContent = UIS.playing ? '❚❚' : '▶'; document.body.classList.toggle('cmp', UIS.mode === 'comparar'); }
  $('#bar').style.width = (UIS.mode === 'gira' ? UIS.t / TOTAL() : UIS.manualT / D) * 100 + '%';
}
buildUI(); sizeAll(); requestAnimationFrame(frame);
if (!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) && !location.search.includes('test')) UIS.playing = true;   /* sin sonido: puede arrancar sola */
/* modo prueba */
window.__shot = async (mode, i, lt, split) => {
  UIS.playing = false; UIS.mode = mode; UIS.city = i; UIS.manualT = lt * D; if (split !== undefined) UIS.split = split;
  await buildCity(i); if (mode === 'gira') UIS.t = INTRO + (i + lt) * D; render(); return true;
};
window.__perf = (n = 30) => { const a = []; for (let k = 0; k < n; k++) { const t0 = performance.now(); UIS.manualT = (UIS.manualT + 1 / 60) % D; render(); a.push(performance.now() - t0); } a.sort((x, y) => x - y); return { med: a[n >> 1], max: a[n - 1] }; };
window.__build = async i => { CACHE.delete(i); const t0 = performance.now(); await buildCity(i); return performance.now() - t0; };
document.title = document.title;   // listo
window.__ready = true;

</script>
