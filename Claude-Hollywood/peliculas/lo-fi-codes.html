  return K[K.length - 1][1];
}
function camGreen(t) {
  const B = walkerAt(t);
  if (t < 6.5) return camKeys(t, [[0, { x: -1180, y: -122, zoom: 2.3, ty: 30 }], [6.5, { x: -790, y: -122, zoom: 2.45, ty: 25 }]]);
  if (t < 13) return camKeys(t, [[6.5, { x: -770, y: -126, zoom: 3.1, ty: -20 }], [13, { x: -765, y: -126, zoom: 3.25, ty: -20 }]]);

}
function camCity(t) {
  const B = walkerAt(Math.min(t, 83.9));

  if (t < 60) return { x: B.x + 70, y: -45, zoom: 2.2, ty: 10 };
  if (t < 72) return { x: B.x + 40, y: -24, zoom: 1.7, ty: 100 };
  if (t < 84) return camKeys(t, [[72, { x: B.x + 200, y: -200, zoom: 1.0, ty: 30 }], [84, { x: CAFE_X - 40, y: -170, zoom: 1.35, ty: 30 }]]);
  if (t < 110) return camKeys(t, [[84, { x: CAFE_X - 40, y: -170, zoom: 1.35, ty: 30 }], [87, { x: CAFE_X - 40, y: -110, zoom: 1.4, ty: -50 }], [98, { x: CAFE_X - 30, y: -110, zoom: 1.5, ty: -50 }], [110, { x: CAFE_X - 30, y: -110, zoom: 1.5, ty: -50 }]]);
  return camKeys(t, [[110, { x: CAFE_X - 30, y: -110, zoom: 1.5, ty: -50 }], [113, { x: CAFE_X + 80, y: -110, zoom: 1.45, ty: -40 }], [118.6, { x: CAR_PARK.x - 30, y: -110, zoom: 1.55, ty: -30 }], [121, { x: CAR_PARK.x, y: -110, zoom: 1.6, ty: -30 }]]);
}
function camSea(t) {
  return camKeys(t, [[155.5, { x: -300, y: -150, zoom: 1.2, ty: 50 }], [161, { x: -200, y: -150, zoom: 1.25, ty: 50 }], [163.4, { x: 0, y: -110, zoom: 1.7, ty: 110 }], [177.6, { x: 0, y: -110, zoom: 1.85, ty: 110 }], [179, { x: 60, y: -160, zoom: .95, ty: 60 }], [185.6, { x: 60, y: -160, zoom: .97, ty: 60 }], [186.6, { x: 0, y: -150, zoom: 2.4, ty: 10 }], [191.4, { x: 0, y: -150, zoom: 2.45, ty: 10 }], [193, { x: 0, y: -120, zoom: 1.6, ty: 90 }], [210, { x: 20, y: -180, zoom: .9, ty: 70 }]]);

const DRZ = [[120, 1], [131.5, 1], [133, 2.1], [139, 2.15], [140.6, .85], [149.5, .85], [151, 1]];
function drZoom(t) { const k = DRZ; if (t <= k[0][0]) return k[0][1]; for (let i = 0; i < k.length - 1; i++) if (t < k[i + 1][0]) return lerp(k[i][1], k[i + 1][1], eio((t - k[i][0]) / (k[i + 1][0] - k[i][0]))); return k[k.length - 1][1]; }
/* ---------- escenas ---------- */
function sceneGreen(t) {
  camSet(camGreen(t)); WIND.x = windAt(t) * .8; const B = walkerAt(t);
  drawSet(t, { items: put => put(B.z - .5, () => drawBrote(B, t)), floorFx: t2 => floorLeaves(t2), fx: t2 => { sunRays(t2, 1.2); leavesFall(t2, .8); } });

  post(t);
}
function sceneCity(t) {
  camSet(camCity(t)); WIND.x = .3; const B = walkerAt(t);
  drawCity(t, { refl: t2 => { if (B && B.city && !B.hide) spReflect(broteCanvas(B.f), B.x, B.y, B.z, t2); ripples(t2, CPUD, 'c'); },
    items: put => { put(CZ.cart + 12, () => drawTetera(t)); put(B.z - .5, () => drawBrote(B, t)); put(CAR_PARK.z, () => drawParkedCar(CAR_PARK.x, CAR_PARK.z, t, t > 118.6)); put(CZ.cart - 20, () => flyingCup(t)); },
    fx: t2 => { sunRays(t2, .8); leavesFall(t2, 1); if (t > 86.2 && t < 89.6) { const [fx, fy] = wFoot(B.x, B.y + 76, B.z); bubble(fx + 4 * wCell(B.z), fy, wCell(B.z) * .8, 'cup', win(t, 86.2, 89.6, .15, .3), 1); } if (t > 111 && t < 113.4) { const [fx, fy] = wFoot(B.x, B.y + 80, B.z); bubble(fx, fy, wCell(B.z) * .8, 'heart', win(t, 111, 113.4, .15, .3)); } } });
  post(t);
}
function sceneDrive(t) { drawDrive(t, { zoom: drZoom(t), fx: -150 }); post(t); }
function sceneSea(t) {
  camSet(camSea(t)); const B = walkerAt(t);
  drawSea(t, { items: put => { put(SEA_CAR.z, () => drawParkedCar(SEA_CAR.x, SEA_CAR.z, t, t < 157.4)); put(B.z - .5, () => drawBrote(B, t)); }, fx: t2 => { leavesFall(t2, .5, 250, 700); } });

}
const FILM = {
  DUR: 216, CHAPTERS,
  load() { floorLeavesInit(); cityInit(); driveInit(); seaInit(); stepsInit(); pigeonsInit(walkerAt); },
  draw(t) {
    T0();
    if (t < 33.5) inkWipe(() => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(PAPER, 0, 0, W, H); T0(); }, () => sceneGreen(t), clamp(t / 3), 'abre', 'center', .38, .5);
    else if (t < 35.5) inkWipe(() => sceneGreen(t), () => sceneCity(t), (t - 33.5) / 2, 'ciudad', 'sweep');
    else if (t < 98) sceneCity(t);
    else if (t < 99.2) inkWipe(() => sceneCity(t), () => latteInsert(t), (t - 98) / 1.2, 'latte', 'center', .5, .5);
    else if (t < 109.2) latteInsert(t);
    else if (t < 110.4) inkWipe(() => latteInsert(t), () => sceneCity(t), (t - 109.2) / 1.2, 'latte2', 'center', .5, .5);
    else if (t < 118.6) sceneCity(t);
    else if (t < 120.6) inkWipe(() => sceneCity(t), () => sceneDrive(t), (t - 118.6) / 2, 'auto', 'sweep');
    else if (t < 155.5) sceneDrive(t);
    else if (t < 157.5) inkWipe(() => sceneDrive(t), () => sceneSea(t), (t - 155.5) / 2, 'mar', 'sweep');
    else sceneSea(t);
    /* fundido final al papel */
    const e = sm((t - 212.4) / 3.2); if (e > 0) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = e; ctx.drawImage(PAPER, 0, 0, W, H); ctx.restore(); T0(); }
  },
};

/* =====================================================================
   REPRODUCTOR: carga por pasos, bucle, subtítulos en el DOM, controles, modo prueba (?t=)
   ===================================================================== */
const btn = document.getElementById('play'), bar = document.getElementById('bar'), chap = document.getElementById('chap'), STAGE = document.getElementById('stage');
resize = function () {
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  let w = Math.max(320, Math.round(r.width * dpr)), h = Math.max(180, Math.round(r.height * dpr));
  const k = Math.min(1, 1920 / w, 1080 / h); w = Math.round(w * k); h = Math.round(h * k);
  if (w === W && h === H) return false;
  W = cv.width = w; H = cv.height = h; U = H / 1000; SW = W / U;
  PAPER = makePaper(W, H); FX = mk(W, H); fx = FX.getContext('2d'); POSTPAT = null; VIG = null;
  if (typeof onResize === 'function') onResize();
  return true;
};
let T = 0, PLAY = false, LASTF = performance.now(), ACCF = 0, FROZ = null, READY = false, SUBS_ON = true;
const TEST = /[?&]t=/.test(location.search);
async function load() {
  const step = async (txt, f) => { btn.textContent = txt; await new Promise(r => setTimeout(r, 0)); await f(); };
  resize();
  await step('Mezclando los pigmentos…', () => { GRAIN = makeGrain(); WASHTEX = makeWashTex(); BLOT = makeBlot(); });
  await step('Pintando el cielo de otoño…', () => { SKY = makeSky(); });
  await step('Pintando el bosque…', () => { FOREST = makeForest(); });
  await step('Pintando el muro de cristal…', () => { FWA = makeFarWall(false); FWB = makeFarWall(true); });
  await step('Pintando las losas del suelo…', () => { FTN = floorTex(FLN); FTF = floorTex(FLF); FTL = floorTex(FLL, 'light'); });
  await step('Pintando mesas, macetas y frascos…', () => { TABLES = TABLE_AT.map(([, , sd, w], i) => makeTable(sd, w, i >= 4 && i < 8 ? 3 : 2)); JARS = jarSprites(); });
  await step('Pintando la ciudad, la carretera y el mar…', () => FILM.load());
  if (document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]);
  READY = true; btn.textContent = '▶ Darle play (con sonido)'; btn.disabled = false;
  window.__ready = true;
}
function drawFrame(t, ticks) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; SHX = SHY = 0;
  FILM.draw(t, ticks);
}
function frame(now) {
  const dt = Math.min(.1, (now - LASTF) / 1000); LASTF = now;
  resize();
  let ticks = 0;
  if (PLAY) { T += dt; ACCF += dt; ticks = Math.min(4, Math.floor(ACCF * 60)); ACCF -= ticks / 60; if (T >= FILM.DUR) { T = FILM.DUR; PLAY = false; btn.hidden = false; btn.textContent = '↺ Ver otra vez'; STAGE.classList.remove('playing'); } }
  if (READY) drawFrame(FROZ ?? T, ticks);
  bar.style.width = (100 * T / FILM.DUR) + '%';
  if (typeof auUpdate === 'function') auUpdate(T, PLAY);
  requestAnimationFrame(frame);
}
function seekTo(t) { T = clamp(t, 0, FILM.DUR); if (typeof auSeek === 'function') auSeek(T); }
function start() {
  if (!READY) return;
  if (typeof auInit === 'function' && !AU.ac) try { auInit(); } catch (e) { console.warn(e); }
  if (AU.ac && AU.ac.state === 'suspended') AU.ac.resume();
  if (T >= FILM.DUR) seekTo(0);
  PLAY = true; btn.hidden = true; STAGE.classList.add('playing'); if (typeof auSeek === 'function') auSeek(T);
}
function pause() { PLAY = false; btn.hidden = false; btn.textContent = '▶ Seguir'; STAGE.classList.remove('playing'); if (typeof auSeek === 'function') auSeek(T); }
btn.onclick = start; btn.disabled = true;
cv.addEventListener('click', () => { if (btn.hidden) pause(); });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); PLAY ? pause() : start(); }
  if (e.key === 'r' || e.key === 'R') seekTo(0);
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') seekTo(T + (e.key === 'ArrowRight' ? 5 : -5));
});
document.querySelector('.prog').addEventListener('pointerdown', e => { const r = e.currentTarget.getBoundingClientRect(); seekTo(clamp((e.clientX - r.left) / r.width) * FILM.DUR); });
if (chap && FILM.CHAPTERS) chap.innerHTML = FILM.CHAPTERS.map(([t, n]) => `<span style="left:${100 * t / FILM.DUR}%" title="${n}"></span>`).join('');
requestAnimationFrame(frame); load();
/* modo prueba */
window.__seek = (t, warm) => { FROZ = null; if (warm === undefined) warm = 30; for (let i = warm; i > 0; i--) drawFrame(t - i / 60, 1); FROZ = t; T = t; drawFrame(t, 0); };
window.__perf = (t, n = 30) => { const a = []; for (let i = 0; i < n; i++) { const t0 = performance.now(); drawFrame(t + i / 60, 1); a.push(performance.now() - t0); } a.sort((x, y) => x - y); return { med: a[n >> 1], max: a[n - 1] }; };
